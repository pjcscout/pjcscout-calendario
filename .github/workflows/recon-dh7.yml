name: Reconocimiento DH7 (temporal)

on:
  workflow_dispatch:

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install playwright@1.48.0
      - run: npx playwright install --with-deps chromium

      - run: node scripts/scraper/recon-dh7.mjs

      - name: Volcar fragmento de HTML al log
        run: |
          echo "===INICIO-HTML==="
          grep -o '.\{400\}Elche CF.\{1200\}' recon-dh7-html.txt | head -c 3000
          echo "===FIN-HTML==="
