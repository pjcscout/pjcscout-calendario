name: Reconocimiento DH7 (temporal)

on:
  workflow_dispatch:

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install playwright@1.48.0
      - run: npx playwright install --with-deps chromium

      - run: node scripts/scraper/recon-dh7.mjs

      - name: Volcar captura en base64 al log
        run: |
          echo "===INICIO-B64==="
          base64 -w 200 recon-dh7.jpg
          echo "===FIN-B64==="
          ls -la recon-dh7.jpg
