name: Scrapear horarios de la próxima jornada

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  scrape-horarios:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Descargar fecha+hora de cada categoría FFCV
        run: node scripts/scraper/scrape-horarios-ffcv.mjs

      - name: Descargar fecha+hora de DH7 (RFEF)
        run: node scripts/scraper/scrape-horarios-dh7.mjs

      - name: Fusionar en horarios.js
        run: node scripts/scraper/aplicar-horarios.mjs

      - run: npm test

      - run: npm run build

      - name: Generar previa (una imagen por liga)
        run: |
          node scripts/graficas/generar-datos-previa.mjs
          node scripts/graficas/generar-imagenes-previa.mjs

      - name: Instalar ffmpeg (con libx264 y xfade) para el vídeo de la previa
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Generar vídeo de la previa (carrusel de las ligas)
        run: node scripts/graficas/generar-video-previa.mjs

      - name: Subir previa como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: previa-proxima-jornada
          path: scripts/graficas/salida/

      - name: Commitear y subir a main
        id: commit
        run: |
          git config user.name "scrape-bot"
          git config user.email "scrape-bot@users.noreply.github.com"
          git add src/data/horarios.js
          if git commit -m "Horarios: fecha y hora confirmadas de la próxima jornada"; then
            echo "hubo_cambios=true" >> "$GITHUB_OUTPUT"
          else
            echo "sin cambios"
            echo "hubo_cambios=false" >> "$GITHUB_OUTPUT"
          fi
          git push

      # Igual que en scrape-jornada.yml: un push con el GITHUB_TOKEN no
      # dispara el "on: push" de deploy.yml por sí solo.
      - name: Disparar deploy a Netlify
        if: steps.commit.outputs.hubo_cambios == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
