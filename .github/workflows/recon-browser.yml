name: Reconocimiento temporal (navegador real)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recon-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install playwright@1.48.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/scraper/scrape-visitante-alineacion2.mjs > recon-browser-output.txt 2>&1 || true
      - name: Subir resultados
        run: |
          git config user.name "recon-bot"
          git config user.email "recon-bot@users.noreply.github.com"
          git add recon-browser-output.txt jornada1-detalle.json
          git commit -m "Reconocimiento: alineacion visitante v2 (temporal)" || echo "sin cambios"
          git push
