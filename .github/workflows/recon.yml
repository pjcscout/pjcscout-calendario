name: Reconocimiento FFCV (temporal)

on:
  workflow_dispatch:

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/scraper/recon.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: recon-output
          path: recon-output/
          retention-days: 7
