name: Reconocimiento temporal 2 (jornada 1 + goleadores)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recon2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/scraper/build-resultados-j1.mjs
      - name: Subir resultados-j1-import.json
        run: |
          git config user.name "recon-bot"
          git config user.email "recon-bot@users.noreply.github.com"
          git add resultados-j1-import.json
          git commit -m "Reconocimiento: volcado de resultados jornada 1 (temporal)" || echo "sin cambios"
          git push
