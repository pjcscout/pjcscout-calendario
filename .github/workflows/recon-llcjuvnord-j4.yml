name: Reconocimiento llc-juv-nord jornada 4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/scraper/recon-llcjuvnord-j4.mjs
      - name: Subir resultado
        run: |
          git config user.name "recon-bot"
          git config user.email "recon-bot@users.noreply.github.com"
          git add recon-llcjuvnord-j4.json
          git commit -m "Reconocimiento: llc-juv-nord jornada 4 (temporal)" || echo "sin cambios"
          git push
