name: Comprobar estado de jornada

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install playwright@1.48.0
      - run: npx playwright install --with-deps chromium
      - run: JORNADA=3 node scripts/scraper/scrape-jornada-dh7.mjs
      - name: Subir resultado
        run: |
          git config user.name "recon-bot"
          git config user.email "recon-bot@users.noreply.github.com"
          git add jornada3-dh7-actas.json
          git commit -m "Reconocimiento: actas de jornada 3 DH7 (temporal)" || echo "sin cambios"
          git push
