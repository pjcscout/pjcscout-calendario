<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
:root{
  --bg:#faf7ee;
  --borde:#ddd3ba;
  --oro:#a9762e;
  --oro-suave:#7a5220;
  --texto:#201d14;
  --texto-atenuado:#6b6455;
  --display:"Barlow Condensed", system-ui, sans-serif;
  --cuerpo:"Barlow", system-ui, sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0}
body{
  width:1080px;
  background:var(--bg);
  color:var(--texto);
  font-family:var(--cuerpo);
}
.pagina{
  padding:70px 80px 90px;
}
.cabecera{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap:2px;
  margin-bottom:20px;
}
.marca{
  font-family:var(--display);
  font-weight:800;
  letter-spacing:.04em;
  font-size:46px;
  line-height:1;
}
.marca span{
  font-weight:600;
  font-size:.42em;
  letter-spacing:.24em;
  color:var(--oro-suave);
  display:block;
  margin-top:8px;
}
.marca-raya{
  width:90px;
  height:3px;
  background:var(--oro);
  margin:16px 0 20px;
}
.jornada-titulo{
  font-family:var(--display);
  font-weight:800;
  font-size:92px;
  line-height:1;
}
.fecha{
  font-family:var(--cuerpo);
  font-weight:500;
  letter-spacing:.1em;
  text-transform:uppercase;
  font-size:20px;
  color:var(--texto-atenuado);
  margin-top:10px;
}
.subtitulo{
  font-family:var(--cuerpo);
  font-weight:600;
  letter-spacing:.14em;
  text-transform:uppercase;
  font-size:22px;
  color:var(--texto);
  margin-top:26px;
}
.raya-gruesa{
  height:2px;
  background:var(--texto);
  margin:34px 0 0;
}

.grupo{
  padding:34px 0 8px;
  border-bottom:1px solid var(--borde);
}
.grupo:last-of-type{border-bottom:none}
.grupo__nombre{
  font-family:var(--display);
  font-weight:700;
  letter-spacing:.03em;
  font-size:34px;
  color:var(--oro-suave);
  margin-bottom:18px;
}
.partido{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:16px;
  padding:11px 0;
}
.equipo{
  display:flex;
  align-items:center;
  gap:14px;
  min-width:0;
}
.equipo--visitante{flex-direction:row-reverse; text-align:right}
.escudo{width:38px; height:38px; object-fit:contain; flex-shrink:0}
.nombre{
  font-weight:600;
  font-size:22px;
  line-height:1.2;
}
.marcador{
  font-family:var(--display);
  font-weight:800;
  font-size:34px;
  color:var(--oro);
  font-variant-numeric:tabular-nums;
  padding:0 8px;
  white-space:nowrap;
}

.pie{
  display:flex;
  justify-content:center;
  padding-top:56px;
}
.sitio{
  font-family:var(--display);
  font-weight:700;
  letter-spacing:.16em;
  font-size:24px;
  color:var(--oro);
}
</style>
</head>
<body>
<div class="pagina">
  <div class="cabecera">
    <div class="marca">PJC SCOUT<span>&amp; ANALYTICS</span></div>
    <div class="marca-raya"></div>
    <h1 class="jornada-titulo">JORNADA __JORNADA__</h1>
    <div class="fecha">__FECHA__</div>
    <div class="subtitulo">Las 8 ligas del fútbol base</div>
  </div>
  <div class="raya-gruesa"></div>
  <div id="grupos"></div>
  <div class="pie"><span class="sitio">PJCSCOUT.ES</span></div>
</div>

<script>
const D = __DATOS__;
const ORDEN = ["tercera-vi","liga-nacional","cadete-autonomico","cadete-pref-g3","llc-nord","llc-sud","llc-juv-nord","llc-juv-sud","dh-g7"];
// Solo para esta gráfica: algunos nombres oficiales (sobre todo en DH7) son
// demasiado largos para una fila y se cortarían con "...". No se toca
// equipos.js (esos nombres completos sí hacen falta en el resto del sitio).
const NOMBRE_CORTO = {
  "dh7-cartagena": "FC Cartagena",
  "dh7-penya-arrabal": "Penya Arrabal",
  "dh7-ucam": "UCAM Murcia",
  "dh7-murcia-promises": "Murcia Promises",
  "dh7-san-francisco": "CD San Francisco",
};
function nombreCorto(id, nombre){ return NOMBRE_CORTO[id] || nombre; }

const cont = document.getElementById('grupos');
for(const g of ORDEN){
  const d = D.grupos[g];
  if(!d || !d.partidos.length) continue;
  const bloque = document.createElement('div');
  bloque.className = 'grupo';
  const titulo = document.createElement('div');
  titulo.className = 'grupo__nombre';
  titulo.textContent = d.subnombre ? `${d.nombre} · ${d.subnombre}` : d.nombre;
  bloque.appendChild(titulo);
  for(const p of d.partidos){
    const fila = document.createElement('div');
    fila.className = 'partido';
    fila.innerHTML = `
      <div class="equipo">
        <img class="escudo" src="escudos/${p.localId}.png" alt="">
        <span class="nombre">${nombreCorto(p.localId, p.localNombre)}</span>
      </div>
      <div class="marcador">${p.golesLocal} - ${p.golesVisitante}</div>
      <div class="equipo equipo--visitante">
        <img class="escudo" src="escudos/${p.visitanteId}.png" alt="">
        <span class="nombre">${nombreCorto(p.visitanteId, p.visitanteNombre)}</span>
      </div>
    `;
    bloque.appendChild(fila);
  }
  cont.appendChild(bloque);
}
</script>
</body>
</html>
